services:
  payload-fields-test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payload_fields_test
      POSTGRES_USER: payload_fields_test
      POSTGRES_PASSWORD: payload_fields_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload_fields_test -d payload_fields_test"]
      interval: 2s
      timeout: 3s
      retries: 20
